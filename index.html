<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://byoicngamgtcfrqsechh.supabase.co; media-src blob: https://byoicngamgtcfrqsechh.supabase.co; connect-src https://byoicngamgtcfrqsechh.supabase.co wss://byoicngamgtcfrqsechh.supabase.co; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>anon chat</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <div class="logo"><i class="ic i-chat" style="width:40px;height:40px"></i></div>
    <h1>anon chat</h1>
    <p class="sub" id="authSub">Welcome back</p>
    <div class="tabs" id="tabs"><span class="ind"></span><button type="button" id="tabLogin" class="on">Log in</button><button type="button" id="tabSignup">Sign up</button></div>
    <form id="fLogin">
      <label class="l">Email</label>
      <input class="field" id="liEmail" type="email" autocomplete="username" required>
      <label class="l">Password</label>
      <input class="field" id="liPw" type="password" autocomplete="current-password" required>
      <button class="btn" id="liBtn" type="submit">Log in</button>
    </form>
    <form id="fSignup" hidden>
      <label class="l">Invite key</label>
      <input class="field" id="suKey" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" required>
      <label class="l">Email</label>
      <input class="field" id="suEmail" type="email" autocomplete="email" required>
      <label class="l">Password</label>
      <input class="field" id="suPw" type="password" minlength="10" autocomplete="new-password" required>
      <label class="l">Confirm password</label>
      <input class="field" id="suPw2" type="password" minlength="10" autocomplete="new-password" required>
      <div class="hint">You need an invite key from the owner. Passwords need 10 or more characters.</div>
      <button class="btn" id="suBtn" type="submit">Create account</button>
    </form>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><i class="ic i-chat"></i> anon chat</div>
    <div id="channels"></div>
    <div class="me" id="me"></div>
  </aside>
  <div id="scrim"></div>
  <div id="rzl"></div>
  <main id="mainEl">
    <header>
      <button class="iconbtn" id="menuBtn" data-tip="Channels"><i class="ic i-channel"></i></button>
      <span class="title" id="chTitle"></span>
      <span class="grow"></span>
      <span id="timer" data-tip="Next reset" data-tipd="2000"><i class="ic i-timer"></i><span id="timerTxt"></span></span>
      <button class="iconbtn" id="pinsBtn" data-keep data-tip="Pinned Messages" data-tipd="2000"><i class="ic i-pin"></i></button>
      <button class="iconbtn" id="memBtn" data-tip="Show Member List" data-tipd="2000"><i class="ic i-user"></i></button>
    </header>
    <div id="msgs"></div>
    <div id="replyBar" hidden></div>
    <div id="pendingBar" hidden></div>
    <div id="composer">
      <div id="ac" hidden></div>
      <button class="iconbtn" id="attachBtn" data-keep data-tip="Upload or create a poll"><i class="ic i-plus"></i></button>
      <textarea id="input" rows="1" maxlength="2000" placeholder="Message"></textarea>
      <button class="iconbtn" id="favBtn" data-keep data-tip="Saved photos"></button>
      <button class="iconbtn" id="emojiBtn" data-keep data-tip="Emoji"><i class="ic i-emoji"></i></button>
      <button class="iconbtn" id="sendBtn" data-tip="Send"><i class="ic i-send"></i></button>
      <input type="file" id="fileIn" hidden>
    </div>
    <div class="pop" id="favPanel"></div>
    <div class="pop" id="pinsPanel"></div>
  </main>
  <div id="rz"></div>
  <aside id="members"></aside>
</div>

<div class="pop" id="picker"></div>
<div class="pop" id="ctx"></div>
<div id="overlay"><div id="modalBody"></div></div>
<div id="lightbox"><img alt=""></div>
<div id="tip"></div>
<div id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
