<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>anon chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root{--bg:#313338;--side:#2b2d31;--dark:#1e1f22;--input:#383a40;--text:#dbdee1;--muted:#949ba4;--blurple:#5865f2;--hover:#2e3035;--green:#23a559;--red:#f23f43;--gold:#faa61a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "gg sans","Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* icons */
.ic{display:inline-block;width:20px;height:20px;flex-shrink:0;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;vertical-align:middle}
.ic.lg{width:28px;height:28px}.ic.sm{width:16px;height:16px}
.i-send{--i:url(assets/icons/SendMessage.webp)}.i-chat{--i:url(assets/icons/ChatIcon.webp)}.i-arrow{--i:url(assets/icons/ArrowLargeRightIcon.webp)}
.i-book{--i:url(assets/icons/BookCheckIcon.webp)}.i-check{--i:url(assets/icons/CircleCheckIcon.webp)}.i-gift{--i:url(assets/icons/GiftIcon.webp)}
.i-hammer{--i:url(assets/icons/HammerIcon.webp)}.i-hub{--i:url(assets/icons/HubIcon.webp)}.i-id{--i:url(assets/icons/IdIcon.webp)}
.i-kbd{--i:url(assets/icons/KeyboardIcon.webp)}.i-staff{--i:url(assets/icons/StaffBadgeIcon.webp)}.i-timer{--i:url(assets/icons/TimerIcon.webp)}
.i-x{--i:url(assets/icons/XXsmallBoldIcon.webp)}
.sv{width:18px;height:18px;flex-shrink:0;vertical-align:middle}.sv.fill{fill:currentColor}

/* animations */
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px) scale(.97);transform-origin:bottom right;transition:opacity .16s ease,transform .2s var(--ease),visibility 0s .2s}
.pop.open{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}

/* auth */
#auth{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#404eed 0,#232850 60%,#14162b 100%);padding:16px;overflow:auto}
.card{background:var(--bg);border-radius:10px;padding:28px;width:100%;max-width:420px;box-shadow:0 8px 40px #0008;animation:slideUp .3s var(--ease)}
.card .logo{display:flex;justify-content:center;margin-bottom:6px;color:var(--blurple)}
.card h1{margin:0 0 4px;font-size:24px;text-align:center}
.card p.sub{margin:0 0 18px;text-align:center;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--dark);border-radius:6px;padding:3px;position:relative;margin-bottom:14px}
.tabs button{padding:8px;border-radius:4px;color:var(--muted);position:relative;z-index:1;transition:color .2s;font-weight:600}
.tabs button.on{color:#fff}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--blurple);border-radius:4px;transition:transform .25s var(--ease)}
.tabs.s .ind{transform:translateX(100%)}
.card form{animation:fadeIn .25s ease}
.btn{background:var(--blurple);color:#fff;border-radius:4px;padding:10px 16px;font-weight:600;width:100%;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .15s,transform .1s,opacity .15s}
.btn:hover{background:#4752c4}.btn:active{transform:scale(.98)}
.btn.sec{background:#4e5058}.btn.sec:hover{background:#6d6f78}.btn.danger{background:var(--red)}.btn.danger:hover{background:#c93538}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{width:100%;background:var(--dark);border:1px solid transparent;border-radius:4px;padding:10px;margin:4px 0 10px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--blurple)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.err{color:#ff8a8d;font-size:13px;min-height:18px;margin:4px 0}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 10px}

/* layout */
#app{display:flex;height:100%;position:relative;animation:fadeIn .3s ease}
#side{width:240px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0}
.brand{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;box-shadow:0 1px 0 #0003}
#channels{padding:8px 8px;flex:1;overflow:auto}
.chrow{display:flex;align-items:center;position:relative}
.ch{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:6px 8px;border-radius:4px;color:var(--muted);text-align:left;margin-bottom:2px;font-weight:500;transition:background .15s,color .15s,transform .1s}
.ch:hover{background:var(--hover);color:var(--text)}.ch:active{transform:scale(.98)}
.ch.active{background:#404249;color:#fff}.ch.unread{color:#fff;font-weight:700}
.ch .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .ic{width:18px;height:18px;opacity:.8}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:0 6px;min-width:16px;text-align:center;animation:fadeIn .2s}
.chedit,.catact button{width:24px;height:24px;border-radius:4px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,background .15s,color .15s}
.chedit{position:absolute;right:2px;top:3px}
.chrow:hover .chedit,.cat:hover .catact button{opacity:1}
.chedit:hover,.catact button:hover{background:#3d3f45;color:#fff}
@media(hover:none){.chedit,.catact button{opacity:1}}
.cathead{display:flex;align-items:center;margin-top:14px;padding-right:2px}
.catbtn{display:flex;align-items:center;gap:2px;flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:2px 4px;border-radius:4px;transition:color .15s;text-align:left}
.catbtn:hover{color:var(--text)}
.catbtn .ic{width:14px;height:14px;transition:transform .22s var(--ease);transform:rotate(90deg)}
.cat.col .catbtn .ic{transform:none}
.catbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s var(--ease);margin-top:4px}
.cat.col .catbody{grid-template-rows:0fr}
.catin{overflow:hidden;min-height:0}
.ownbar{display:flex;gap:6px;margin-top:16px}
.ownbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);background:#232428;border-radius:4px;padding:6px;transition:background .15s,color .15s}
.ownbar button:hover{background:#3d3f45;color:#fff}
.me{height:52px;background:#232428;display:flex;align-items:center;gap:8px;padding:0 8px}
.me .nm{font-weight:600;font-size:14px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .st{font-size:11px;color:var(--muted)}
.me .grow{flex:1;min-width:0}
.iconbtn{width:32px;height:32px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s,transform .1s;flex-shrink:0}
.iconbtn:hover{background:#3d3f45;color:var(--text)}.iconbtn:active{transform:scale(.92)}
.av{width:40px;height:40px;border-radius:50%;background:#1e1f22;object-fit:cover;flex-shrink:0}
.av.sm{width:32px;height:32px}

main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;box-shadow:0 1px 0 #0003;flex-shrink:0}
header .title{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
header .title .ic{opacity:.7}
header .grow{flex:1}
#timer{font-size:12px;color:var(--muted);background:var(--dark);padding:4px 10px 4px 8px;border-radius:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;transition:color .3s}
#timer .ic{width:14px;height:14px}
#timer.soon{color:var(--gold)}
#menuBtn{display:none}
#msgs{flex:1;overflow-y:auto;padding:12px 0 8px;scroll-behavior:smooth}
#msgs.swap{animation:fadeIn .18s ease}
.empty{padding:40px 20px;color:var(--muted);text-align:center;animation:fadeIn .3s}
.msg{position:relative;padding:2px 48px 2px 72px;min-height:22px;transition:background .15s}
.msg.enter{animation:msgIn .26s var(--ease)}
.msg:not(.grp){margin-top:16px}
.msg:hover{background:#2e3035}
.msg.mention{background:rgba(250,166,26,.1);box-shadow:inset 2px 0 0 var(--gold)}
.msg.mention:hover{background:rgba(250,166,26,.15)}
.msg.flash{background:#404249}
.pinmark{position:absolute;right:10px;top:4px;opacity:.55;color:var(--gold)}.pinmark .ic{width:14px;height:14px}
.msg .avc{position:absolute;left:16px;top:4px;cursor:pointer}
.msg .gt{position:absolute;left:0;width:72px;text-align:center;font-size:10px;color:var(--muted);top:4px;opacity:0;transition:opacity .15s}
.msg:hover .gt{opacity:1}
.mh{display:flex;align-items:baseline;gap:8px}
.un{font-weight:600;cursor:pointer}.un:hover{text-decoration:underline}
.tag{background:var(--blurple);color:#fff;font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px 1px 3px;align-self:center;display:inline-flex;align-items:center;gap:2px}
.tag .ic{width:11px;height:11px}
.ts{font-size:11px;color:var(--muted)}
.body{word-wrap:break-word;overflow-wrap:anywhere}
.body a{color:#00a8fc}
.mt{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;font-weight:500}
.mt.me{background:rgba(250,166,26,.25);color:#ffd9a0}
.replyref{font-size:12.5px;color:var(--muted);margin-left:-32px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.replyref b{color:var(--text)}.replyref:hover{color:var(--text)}
.att{position:relative;display:inline-block;margin-top:4px;max-width:min(420px,100%)}
.att img{max-width:100%;max-height:340px;border-radius:6px;display:block;cursor:zoom-in;background:#1e1f22;transition:filter .15s}
.att img:hover{filter:brightness(1.08)}
.att .favbtn{position:absolute;top:6px;right:6px;background:#000a;border-radius:4px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,transform .1s;color:#fff}
.att:hover .favbtn,.favbtn.on{opacity:1}.favbtn:active{transform:scale(.9)}.favbtn.on{color:var(--gold)}
.file{display:inline-flex;gap:8px;align-items:center;background:var(--side);border:1px solid #1e1f22;border-radius:6px;padding:10px 14px;margin-top:4px;color:#00a8fc;text-decoration:none;transition:background .15s}
.file:hover{background:#35373c}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{display:inline-flex;align-items:center;gap:5px;background:#2b2d31;border:1px solid transparent;border-radius:8px;padding:1px 7px;font-size:14px;transition:border-color .15s,background .15s,transform .1s}
.rx span{font-size:12px;font-weight:600;color:var(--muted)}
.rx:hover{border-color:#6d6f78}.rx:active{transform:scale(.94)}
.rx.mine{background:rgba(88,101,242,.25);border-color:var(--blurple)}.rx.mine span{color:#c9cdfb}
.tools{position:absolute;right:16px;top:-14px;background:var(--bg);border:1px solid #1e1f22;border-radius:6px;display:flex;box-shadow:0 2px 8px #0005;z-index:2;opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .12s,transform .15s var(--ease),visibility 0s .15s}
.msg:hover .tools{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.tools button{padding:5px 8px;color:var(--muted);display:flex;transition:background .12s,color .12s}.tools button:hover{background:#3d3f45;color:#fff}
.tools button.dg:hover{color:var(--red)}

#replyBar,#pendingBar{display:flex;align-items:center;gap:10px;background:#2b2d31;margin:0 16px;border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;color:var(--muted);animation:slideUp .16s var(--ease)}
#replyBar b{color:var(--text)}
#pendingBar img{height:44px;border-radius:4px}
.x{margin-left:auto;color:var(--muted);display:inline-flex;transition:color .15s}.x:hover{color:var(--text)}
#composer{display:flex;align-items:flex-end;gap:2px;background:var(--input);margin:0 16px 20px;border-radius:8px;padding:4px 6px;position:relative}
#composer textarea{flex:1;background:none;border:0;outline:none;resize:none;padding:10px 6px;max-height:200px;line-height:1.35}
#composer .iconbtn{width:38px;height:38px}
#sendBtn{color:var(--muted)}#sendBtn.ready{color:#fff;background:var(--blurple)}#sendBtn.ready:hover{background:#4752c4}
#sendBtn{transition:background .2s,color .2s,transform .1s}
#ac{position:absolute;left:44px;bottom:100%;background:#2b2d31;border-radius:6px;box-shadow:0 4px 16px #000a;min-width:240px;overflow:hidden;margin-bottom:6px;z-index:20;animation:slideUp .12s}
#ac div{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer}
#ac div.sel,#ac div:hover{background:#404249}
#members{width:240px;background:var(--side);padding:16px 8px;overflow:auto;flex-shrink:0}
#members h4{margin:0 8px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.mem{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:4px;cursor:pointer;position:relative;transition:background .15s,opacity .2s}
.mem:hover{background:var(--hover)}.mem.off{opacity:.4}
.mem .dot{position:absolute;left:30px;top:26px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--side)}
.mem .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mem .eid{margin-left:auto;opacity:0;color:var(--muted);transition:opacity .15s}.mem:hover .eid{opacity:1}

.pop{position:absolute;background:#2b2d31;border-radius:8px;box-shadow:0 4px 20px #000b;z-index:30;padding:8px}
#picker{display:grid;grid-template-columns:repeat(8,34px);gap:2px;position:fixed}
#picker button{width:34px;height:34px;font-size:20px;border-radius:4px;transition:background .12s,transform .1s}#picker button:hover{background:#404249;transform:scale(1.12)}
#favPanel{right:16px;bottom:76px;width:min(380px,calc(100% - 32px));max-height:50%;overflow:auto}
#favPanel .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#favPanel .fi{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#1e1f22;cursor:pointer;transition:transform .15s var(--ease)}
#favPanel .fi:hover{transform:scale(1.03)}
#favPanel .fi img{width:100%;height:100%;object-fit:cover}
#favPanel .fi .rm{position:absolute;top:3px;right:3px;background:#000b;border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
#favPanel .fi:hover .rm{opacity:1}
@media(hover:none){#favPanel .fi .rm{opacity:1}}
#pinsPanel{right:16px;top:52px;width:min(380px,calc(100% - 32px));max-height:60%;overflow:auto}
.pinitem{padding:8px;border-radius:6px;cursor:pointer;border-bottom:1px solid #1e1f22;transition:background .15s}.pinitem:hover{background:#35373c}
.pinitem small{color:var(--muted)}
.ph{display:flex;align-items:center;gap:8px;font-weight:700}
#overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
#overlay.open{opacity:1;visibility:visible;transition-delay:0s}
#modalBody{background:var(--bg);border-radius:10px;padding:24px;width:100%;max-width:440px;max-height:90%;overflow:auto;position:relative;transform:translateY(12px) scale(.97);transition:transform .25s var(--ease)}
#overlay.open #modalBody{transform:none}
#modalBody h2{margin:0 0 12px;display:flex;align-items:center;gap:8px;font-size:20px}
#modalBody .mx{position:absolute;right:12px;top:12px}
#modalBody .row{display:flex;gap:8px;margin-top:12px}
#modalBody p{margin:0 0 10px;color:var(--muted)}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid #3f4147}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.kv .val{background:var(--dark);border-radius:4px;padding:9px 10px;margin-top:4px;overflow-wrap:anywhere}
.invites{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.inv{display:flex;align-items:center;gap:8px;background:var(--dark);border-radius:6px;padding:8px 10px;flex-wrap:wrap;animation:slideUp .2s var(--ease)}
.inv code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#fff}
.inv .st{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.inv .st.ok{color:var(--green)}.inv .st small{color:var(--muted)}
.inv.used code{text-decoration:line-through;opacity:.5}
.mini{font-size:12px;background:#4e5058;border-radius:4px;padding:3px 8px;transition:background .15s}.mini:hover{background:#6d6f78}
.inv .mini{margin-left:0}
#lightbox{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#lightbox.open{opacity:1;visibility:visible;transition-delay:0s}
#lightbox img{max-width:94%;max-height:94%;border-radius:6px;transform:scale(.96);transition:transform .25s var(--ease)}
#lightbox.open img{transform:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#111214;color:#fff;padding:10px 16px;border-radius:6px;z-index:70;box-shadow:0 4px 16px #000a;font-size:14px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,transform .25s var(--ease),visibility 0s .25s}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
#scrim{position:fixed;inset:0;background:#0008;z-index:14;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;display:none}

@media(max-width:900px){
 #members{position:absolute;right:0;top:0;bottom:0;z-index:15;box-shadow:-4px 0 16px #0008;transform:translateX(105%);transition:transform .25s var(--ease)}
 #app.show-members #members{transform:none}
 #scrim{display:block}#app.show-members #scrim,#app.show-side #scrim{opacity:1;visibility:visible;transition-delay:0s}
}
@media(max-width:700px){
 #side{position:absolute;left:0;top:0;bottom:0;z-index:25;transform:translateX(-105%);transition:transform .25s var(--ease);box-shadow:4px 0 16px #0008}
 #app.show-side #side{transform:none}
 #scrim{z-index:20}#side{z-index:25}
 #menuBtn{display:inline-flex}
 .msg{padding:2px 16px 2px 64px}.msg .avc{left:10px}.msg .gt{width:64px}
 #composer{margin:0 8px 12px}#replyBar,#pendingBar{margin:0 8px}
}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <div class="logo"><i class="ic lg i-chat" style="width:40px;height:40px"></i></div>
    <h1>anon chat</h1>
    <p class="sub" id="authSub">Welcome back</p>
    <div class="tabs" id="tabs"><span class="ind"></span><button type="button" id="tabLogin" class="on">Log in</button><button type="button" id="tabSignup">Sign up</button></div>

    <form id="fLogin">
      <label class="l">Email</label>
      <input class="field" id="liEmail" type="email" autocomplete="username" required>
      <label class="l">Password</label>
      <input class="field" id="liPw" type="password" autocomplete="current-password" required>
      <button class="btn" id="liBtn" type="submit">Log in</button>
    </form>

    <form id="fSignup" hidden>
      <label class="l">Invite key</label>
      <input class="field" id="suKey" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" required>
      <label class="l">Email</label>
      <input class="field" id="suEmail" type="email" autocomplete="email" required>
      <label class="l">Password</label>
      <input class="field" id="suPw" type="password" minlength="8" autocomplete="new-password" required>
      <label class="l">Confirm password</label>
      <input class="field" id="suPw2" type="password" minlength="8" autocomplete="new-password" required>
      <div class="hint">You need an invite key from the owner to create an account.</div>
      <button class="btn" id="suBtn" type="submit">Create account</button>
    </form>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><i class="ic i-chat"></i> anon chat</div>
    <div id="channels"></div>
    <div class="me" id="me"></div>
  </aside>
  <div id="scrim"></div>
  <main id="mainEl">
    <header>

/* ---------- helpers ---------- */
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function prof(id) { return state.profiles.get(id) || {id, username: 'Unknown', avatar_url: avatarFor(id)}; }
function rebuildNames() { state.byName = new Map(); state.profiles.forEach(p => state.byName.set(p.username.toLowerCase(), p)); }
async function ensureProfile(id) {
  if (state.profiles.has(id)) return;
  const {data} = await sb.from('profiles').select('*').eq('id', id).maybeSingle();
  if (data) { state.profiles.set(id, data); rebuildNames(); renderMembers(); }
}
function mentionsMe(text) {
  if (!text || !state.me) return false;
  return new RegExp('@' + prof(state.me.id).username + '(?![A-Za-z0-9_])', 'i').test(text);
}
function formatContent(text) {
  let h = esc(text);
  h = h.replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  h = h.replace(/(^|[\s>(])@([A-Za-z0-9_]{2,24})(?![A-Za-z0-9_])/g, (full, pre, name) => {
    const p = state.byName.get(name.toLowerCase());
    return p ? `${pre}<span class="mt${p.id === state.me.id ? ' me' : ''}">@${esc(p.username)}</span>` : full;
  });
  return h.replace(/\n/g, '<br>');
}
function pathFromUrl(url) {
  const i = url.indexOf('/object/public/chat/');
  return i < 0 ? null : decodeURIComponent(url.slice(i + '/object/public/chat/'.length));
}
const publicUrl = path => sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
const extOf = n => (n.split('.').pop() || 'bin').replace(/[^A-Za-z0-9]/g, '').slice(0, 8) || 'bin';

/* ---------- overlay manager: only one frame open at a time ---------- */
const PANELS = ['pinsPanel', 'favPanel', 'picker'];
let modalLock = false;
function closeOverlays(except) {
  PANELS.forEach(id => { if (id !== except) $(id).classList.remove('open'); });
  if (except !== 'modal') closeModal();
  if (except !== 'lightbox') $('lightbox').classList.remove('open');
  if (except !== 'drawer') $('app').classList.remove('show-side', 'show-members');
}
function togglePanel(id) {
  const el = $(id), was = el.classList.contains('open');
  closeOverlays(was ? 'none' : id);
  el.classList.toggle('open', !was);
  return !was;
}
function toggleDrawer(which) {
  const app = $('app'), cls = 'show-' + which, was = app.classList.contains(cls);
  closeOverlays('none');
  if (!was) app.classList.add(cls);
}
function showModal(html, opts = {}) {
  closeOverlays('modal');
  modalLock = !!opts.lock;
  $('modalBody').innerHTML = (opts.lock ? '' : `<button class="iconbtn mx" id="mClose" title="Close">${ic('x')}</button>`) + html;
  if (!opts.lock) $('mClose').onclick = () => closeModal();
  $('overlay').classList.add('open');
}
function closeModal(force) {
  if (modalLock && !force) return;
  modalLock = false;
  $('overlay').classList.remove('open');
}
$('overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });
$('lightbox').onclick = () => $('lightbox').classList.remove('open');
$('scrim').onclick = () => $('app').classList.remove('show-side', 'show-members');
document.addEventListener('mousedown', e => {

});

/* ---------- auth ---------- */
function authErr(m) { $('authErr').textContent = m || ''; }
function showAuth() { $('auth').hidden = false; $('app').hidden = true; }
function setTab(signup) {
  $('tabs').classList.toggle('s', signup);

/* notice shown after signing up, cannot be dismissed for 10 seconds */
function showNotice(user) {
  showModal(`<h2>${ic('timer')} Before you start</h2>
    <p>Chat history is wiped every 5 minutes. Messages, reactions, pins and uploaded files all disappear on each 5 minute mark.</p>
    <p>Use the star on a photo to save it, so you can still resend it later.</p>
    <button class="btn" id="ackBtn" disabled>Got it (10)</button>`, {lock: true});
  let n = 10;
  const iv = setInterval(() => {
    n--;
    const b = $('ackBtn'); if (!b) return clearInterval(iv);
    if (n > 0) b.textContent = `Got it (${n})`;
    else { clearInterval(iv); b.textContent = 'Got it'; b.disabled = false; }
  }, 1000);
  $('ackBtn').onclick = () => {
    localStorage.removeItem('anonchat_notice');
    closeModal(true); start(user);
  };
}

async function boot() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return showAuth();
  if (localStorage.getItem('anonchat_notice') === session.user.id) { $('auth').hidden = false; showNotice(session.user); }
  else start(session.user);
}

/* ---------- start ---------- */
let started = false;
async function start(user) {
  if (started) return; started = true;
  state.me = user;
  $('auth').hidden = true; $('app').hidden = false;
  const [pr, oid, cats, chs] = await Promise.all([
    sb.from('profiles').select('*'), sb.rpc('owner_id'),
    sb.from('categories').select('*'), sb.from('channels').select('*'),
  ]);
  (pr.data || []).forEach(p => state.profiles.set(p.id, p));
  (cats.data || []).forEach(c => state.categories.set(c.id, c));
  (chs.data || []).forEach(c => state.channels.set(c.id, c));
  rebuildNames();
  state.ownerId = oid.data; state.isOwner = oid.data === user.id;
  const first = [...state.channels.values()].sort(byPos)[0];
  if (first && ![...state.channels.values()].some(c => c.name === state.channel)) state.channel = first.name;
  await Promise.all([loadMessages(), loadFavs()]);
  renderAll();
  subscribe();
  tick(); setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTitle(); });
}

async function loadMessages() {
  const {data: ms} = await sb.from('messages').select('*').order('id', {ascending: false}).limit(400);
  state.messages = new Map(); state.reactions = new Map();
  (ms || []).forEach(m => state.messages.set(m.id, m));
  const ids = (ms || []).map(m => m.id);
  if (ids.length) {
    const {data: rs} = await sb.from('reactions').select('*').in('message_id', ids);
    (rs || []).forEach(addReaction);
  }
  for (const m of state.messages.values()) ensureProfile(m.user_id);
}
async function loadFavs() {
  const {data} = await sb.from('favorites').select('*').order('created_at', {ascending: false});
  state.favs = data || [];
}

/* ---------- realtime ---------- */
function subscribe() {
  sb.channel('db')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'messages'}, onMsg)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'reactions'}, onReact)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'profiles'}, onProf)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'channels'}, onChannel)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'categories'}, onCategory)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'invite_keys'}, onInvite)
    .subscribe();
  const pc = sb.channel('online', {config: {presence: {key: state.me.id}}});
  pc.on('presence', {event: 'sync'}, () => { state.online = new Set(Object.keys(pc.presenceState())); renderMembers(); })
    .subscribe(async s => { if (s === 'SUBSCRIBED') await pc.track({t: Date.now()}); });
}
async function onMsg(p) {
  if (p.eventType === 'INSERT') {
    const m = p.new;
    if (state.messages.has(m.id)) return;
    await ensureProfile(m.user_id);
    state.messages.set(m.id, m);
    if (m.user_id !== state.me.id && (m.channel !== state.channel || document.hidden)) {
      state.unread[m.channel] = (state.unread[m.channel] || 0) + 1;
      if (mentionsMe(m.content)) state.mentionCount++;
      renderChannels(); updateTitle();
    }
    if (m.channel === state.channel) renderMessages();
  } else if (p.eventType === 'UPDATE') {
    const old = state.messages.get(p.new.id);
    if (old) state.messages.set(p.new.id, {...old, ...p.new});
    renderMessages(); renderPins();
  } else if (p.eventType === 'DELETE') {
    state.messages.delete(p.old.id); state.reactions.delete(p.old.id);
    renderMessages(); renderPins();
  }
}
function addReaction(r) {
  const list = state.reactions.get(r.message_id) || [];
  if (!list.some(x => x.user_id === r.user_id && x.emoji === r.emoji)) list.push(r);
  state.reactions.set(r.message_id, list);
}
function onReact(p) {
  if (p.eventType === 'INSERT') addReaction(p.new);
  else if (p.eventType === 'DELETE') {
    const o = p.old, list = state.reactions.get(o.message_id);
    if (list) state.reactions.set(o.message_id, list.filter(x => !(x.user_id === o.user_id && x.emoji === o.emoji)));
  }
  renderMessages();
}
function onProf(p) {
  if (p.new && p.new.id) {
    state.profiles.set(p.new.id, p.new); rebuildNames();
    renderMe(); renderMembers(); renderMessages(); renderInvites();
  }
}
function onChannel(p) {
  if (p.eventType === 'DELETE') {
    const prev = state.channels.get(p.old.id); if (!prev) return;
    state.channels.delete(p.old.id);
    for (const [id, m] of state.messages) if (m.channel === prev.name) state.messages.delete(id);
    if (state.channel === prev.name) { const f = [...state.channels.values()].sort(byPos)[0]; if (f) selectChannel(f.name); }
  } else {
    const prev = state.channels.get(p.new.id);
    if (prev && prev.name !== p.new.name) {
      for (const m of state.messages.values()) if (m.channel === prev.name) m.channel = p.new.name;
      if (state.unread[prev.name]) { state.unread[p.new.name] = state.unread[prev.name]; delete state.unread[prev.name]; }
      if (state.channel === prev.name) state.channel = p.new.name;
    }
    state.channels.set(p.new.id, p.new);
  }
  renderChannels(); renderTitle(); renderMessages();
}
function onCategory(p) {
  if (p.eventType === 'DELETE') {
    state.categories.delete(p.old.id);
    for (const c of state.channels.values()) if (c.category_id === p.old.id) c.category_id = null;
  } else state.categories.set(p.new.id, p.new);
  renderChannels();
}
function onInvite(p) {
  if (!state.isOwner) return;
  if (p.eventType === 'INSERT') { if (!state.invites.some(k => k.id === p.new.id)) state.invites.unshift(p.new); }
  else if (p.eventType === 'UPDATE') {
    const prev = state.invites.find(k => k.id === p.new.id);
    state.invites = state.invites.map(k => k.id === p.new.id ? p.new : k);
    if (p.new.used_at && !(prev && prev.used_at)) toast('An invite key was just used');
  } else if (p.eventType === 'DELETE') state.invites = state.invites.filter(k => k.id !== p.old.id);
  renderInvites();
}

/* ---------- sidebar: categories and channels ---------- */
function renderAll() { renderChannels(); renderTitle(); renderMe(); renderMembers(); renderMessages('reset'); renderReply(); renderPending(); updateSend(); }

function chRow(c) {
  const u = state.unread[c.name] || 0;
  return `<div class="chrow"><button class="ch ${c.name === state.channel ? 'active' : ''} ${u ? 'unread' : ''}" data-ch="${esc(c.name)}">${ic('chat')}<span class="cn">${esc(c.name)}</span>${u ? `<span class="badge">${u}</span>` : ''}</button>
    ${state.isOwner ? `<button class="chedit" data-act="editch" data-id="${c.id}" title="Edit channel">${svg('pencil')}</button>` : ''}</div>`;
}
function renderChannels() {
  const cats = [...state.categories.values()].sort(byPos);
  const chs = [...state.channels.values()].sort(byPos);
  const loose = chs.filter(c => !c.category_id || !state.categories.has(c.category_id));
  let h = loose.map(chRow).join('');
  for (const cat of cats) {
    const list = chs.filter(c => c.category_id === cat.id);
    h += `<div class="cat ${state.collapsed.has(cat.id) ? 'col' : ''}" data-cat="${cat.id}">
      <div class="cathead"><button class="catbtn" data-act="togglecat" data-id="${cat.id}">${ic('arrow')}<span>${esc(cat.name)}</span></button>
        ${state.isOwner ? `<span class="catact"><button data-act="addch" data-id="${cat.id}" title="Create channel">${svg('plus')}</button><button data-act="editcat" data-id="${cat.id}" title="Edit category">${svg('pencil')}</button></span>` : ''}</div>
      <div class="catbody"><div class="catin">${list.map(chRow).join('')}</div></div></div>`;
  }
  if (state.isOwner) h += `<div class="ownbar"><button data-act="addcat">${svg('plus')} Category</button><button data-act="addch" data-id="">${svg('plus')} Channel</button></div>`;
  $('channels').innerHTML = h;
}
function renderTitle() {
  $('chTitle').innerHTML = `${ic('chat')}<span>${esc(state.channel)}</span>`;
  $('input').placeholder = 'Message #' + state.channel;
}
function selectChannel(name) {
  if (name === state.channel && $('msgs').dataset.ch === name) return;
  state.channel = name; state.unread[name] = 0;
  if (!Object.values(state.unread).some(Boolean)) state.mentionCount = 0;
  state.replyTo = null; renderReply();
  document.querySelectorAll('.ch').forEach(b => {
    b.classList.toggle('active', b.dataset.ch === name);
    if (b.dataset.ch === name) { b.classList.remove('unread'); const bd = b.querySelector('.badge'); if (bd) bd.remove(); }
  });
  renderTitle(); renderMessages('reset'); renderPins(); updateTitle();
  closeOverlays('none');
}
$('channels').addEventListener('click', e => {
  const t = e.target.closest('[data-ch],[data-act]'); if (!t) return;
  if (t.dataset.ch) return selectChannel(t.dataset.ch);
  const act = t.dataset.act, id = t.dataset.id ? +t.dataset.id : null;
  if (act === 'togglecat') {
    const el = t.closest('.cat'); el.classList.toggle('col');
    if (el.classList.contains('col')) state.collapsed.add(id); else state.collapsed.delete(id);
    localStorage.setItem('anonchat_collapsed', JSON.stringify([...state.collapsed]));
  } else if (act === 'addch') openChannelModal(null, id);
  else if (act === 'editch') openChannelModal(id);
  else if (act === 'addcat') openCategoryModal();
  else if (act === 'editcat') openCategoryModal(id);
});

function catOptions(sel) {
  return `<option value="">No category</option>` + [...state.categories.values()].sort(byPos)
    .map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}
function confirmDelete(btn, run) {
  let armed = false;
  btn.onclick = () => {
    if (!armed) { armed = true; btn.textContent = 'Click again to confirm'; setTimeout(() => { armed = false; btn.textContent = 'Delete'; }, 3500); return; }
    run();
  };
}
function openChannelModal(id, catId) {
  const ch = id ? state.channels.get(id) : null;
  showModal(`<h2>${ic('chat')} ${ch ? 'Edit channel' : 'Create channel'}</h2>
    <label class="l">Channel name</label>
    <input class="field" id="chName" maxlength="32" placeholder="new-channel" value="${esc(ch ? ch.name : '')}" autocomplete="off">
    <label class="l">Category</label>
    <select class="field" id="chCat">${catOptions(ch ? ch.category_id : catId)}</select>

const rendered = new Map();
let renderedChannel = null, stick = true;
function renderMessages(mode) {
  const box = $('msgs');
  let first = false;
  if (mode === 'reset' || renderedChannel !== state.channel) {
    box.innerHTML = ''; rendered.clear(); renderedChannel = state.channel; box.dataset.ch = state.channel; first = true;
    box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap');
  }
  const near = stick;
  const list = [...state.messages.values()].filter(m => m.channel === state.channel).sort((a, b) => a.id - b.id);
  const want = []; let prev = null;
  for (const m of list) {
    const grp = prev && prev.user_id === m.user_id && !m.reply_to && (new Date(m.created_at) - new Date(prev.created_at)) < 300000;
    want.push({id: m.id, html: msgHtml(m, grp)}); prev = m;
  }
  const ids = new Set(want.map(w => w.id));
  const els = new Map([...box.querySelectorAll(':scope > .msg')].map(e => [+e.dataset.id, e]));
  els.forEach((e, id) => { if (!ids.has(id)) { e.remove(); rendered.delete(id); els.delete(id); } });
  const empty = box.querySelector(':scope > .empty');
  if (!want.length) {
    if (!empty) box.insertAdjacentHTML('beforeend', `<div class="empty">Welcome to #${esc(state.channel)}.<br>Say something to get things going.</div>`);
  } else if (empty) empty.remove();
  let anchor = null;
  for (const w of want) {
    let el = els.get(w.id);
    if (!el || rendered.get(w.id) !== w.html) {
      const t = document.createElement('template'); t.innerHTML = w.html.trim();
      const n = t.content.firstElementChild;
      if (!el && !first) n.classList.add('enter');
      if (el) el.replaceWith(n);
      el = n; rendered.set(w.id, w.html);
    }
    const expected = anchor ? anchor.nextElementSibling : box.firstElementChild;
    if (el !== expected) box.insertBefore(el, expected);
    anchor = el;
  }
  if (first) { box.style.scrollBehavior = 'auto'; box.scrollTop = box.scrollHeight; box.style.scrollBehavior = ''; stick = true; }
  else if (near) box.scrollTo({top: box.scrollHeight, behavior: 'smooth'});
}
$('msgs').addEventListener('scroll', e => { const b = e.target; stick = b.scrollHeight - b.scrollTop - b.clientHeight < 140; });
$('msgs').addEventListener('load', e => { if (e.target.tagName === 'IMG' && stick) { const b = $('msgs'); b.style.scrollBehavior = 'auto'; b.scrollTop = b.scrollHeight; b.style.scrollBehavior = ''; } }, true);

$('msgs').addEventListener('click', e => {

/* ---------- reactions & emoji ---------- */
async function toggleReaction(mid, emoji) {
  const me = state.me.id, list = state.reactions.get(mid) || [];
  const mine = list.find(r => r.user_id === me && r.emoji === emoji);
  if (mine) {
    state.reactions.set(mid, list.filter(r => r !== mine)); renderMessages();
    await sb.from('reactions').delete().match({message_id: mid, user_id: me, emoji});
  } else {
    addReaction({message_id: mid, user_id: me, emoji}); renderMessages();
    const {error} = await sb.from('reactions').insert({message_id: mid, emoji});

let pickerCb = null, pickerAnchor = null;

  closeOverlays('picker');

/* ---------- composer ---------- */
const ta = $('input');
function autosize() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }
function updateSend() { $('sendBtn').classList.toggle('ready', !!(ta.value.trim() || state.pending)); }
let ac = null;
function hideAC() { ac = null; $('ac').hidden = true; }
function renderAC() {
  $('ac').hidden = false;
  $('ac').innerHTML = ac.items.map((p, i) => `<div class="${i === ac.idx ? 'sel' : ''}" data-i="${i}"><img class="av sm" src="${esc(p.avatar_url)}" alt=""> ${esc(p.username)}</div>`).join('');
}
function updateAC() {
  const pos = ta.selectionStart;
  const m = /(^|\s)@([A-Za-z0-9_]*)$/.exec(ta.value.slice(0, pos));
  if (!m) return hideAC();
  const q = m[2].toLowerCase();
  const items = [...state.profiles.values()].filter(p => p.username.toLowerCase().startsWith(q)).slice(0, 6);
  if (!items.length) return hideAC();
  ac = {items, idx: 0, start: pos - m[2].length - 1};
  renderAC();
}
function pickAC(i) {
  const p = ac.items[i], pos = ta.selectionStart;
  ta.value = ta.value.slice(0, ac.start) + '@' + p.username + ' ' + ta.value.slice(pos);
  const np = ac.start + p.username.length + 2;
  ta.setSelectionRange(np, np); hideAC(); ta.focus(); updateSend();
}
$('ac').onmousedown = e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) pickAC(+d.dataset.i); };
ta.addEventListener('input', () => { autosize(); updateAC(); updateSend(); });
ta.addEventListener('keydown', e => {
  if (ac) {
    if (e.key === 'ArrowDown') { e.preventDefault(); ac.idx = (ac.idx + 1) % ac.items.length; return renderAC(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); ac.idx = (ac.idx - 1 + ac.items.length) % ac.items.length; return renderAC(); }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pickAC(ac.idx); }
    if (e.key === 'Escape') { e.stopPropagation(); return hideAC(); }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ta.addEventListener('paste', e => {
  const f = [...(e.clipboardData?.files || [])][0];
  if (f) { e.preventDefault(); setPending(f); }
});
$('attachBtn').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => { if (e.target.files[0]) setPending(e.target.files[0]); e.target.value = ''; };
$('mainEl').addEventListener('dragover', e => e.preventDefault());
$('mainEl').addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) setPending(f); });
function setPending(file) {
  if (file.size > MAX_FILE) return toast('Files must be under 10 MB');
  state.pending = {file, url: file.type.startsWith('image/') ? URL.createObjectURL(file) : null};
  renderPending(); ta.focus();
}

let sending = false, lastSend = 0;
async function send() {
  const text = ta.value.trim();
  if ((!text && !state.pending) || sending) return;
  if (Date.now() - lastSend < 600) return;
  sending = true; $('sendBtn').disabled = true;
  try {
    const row = {channel: state.channel, content: text, reply_to: state.replyTo || null};
    if (state.pending) {
      const f = state.pending.file, path = 'att/' + crypto.randomUUID() + '.' + extOf(f.name);
      const {error} = await sb.storage.from('chat').upload(path, f, {contentType: f.type || 'application/octet-stream'});
      if (error) throw error;
      Object.assign(row, {attachment_url: publicUrl(path), attachment_name: f.name.slice(0, 100), attachment_type: f.type || 'application/octet-stream'});
    }
    const {data, error} = await sb.from('messages').insert(row).select().single();
    if (error) throw error;
    if (!state.messages.has(data.id)) state.messages.set(data.id, data);
    ta.value = ''; autosize(); hideAC();
    state.pending = null; state.replyTo = null; renderPending(); renderReply();
    stick = true; renderMessages(); lastSend = Date.now();
  } catch (e) { toast('Could not send: ' + (e.message || 'error')); }
  sending = false; $('sendBtn').disabled = false; updateSend(); ta.focus();
}
$('sendBtn').onclick = send;

/* ---------- saved photos ---------- */
async function toggleFav(mid) {
  const m = state.messages.get(mid); if (!m || !m.attachment_url) return;
  const src = pathFromUrl(m.attachment_url); if (!src) return;
  const name = src.split('/').pop();
  const existing = state.favs.find(f => f.path.split('/').pop() === name);
  if (existing) { await removeFav(existing); toast('Removed from saved photos'); return; }
  const dest = `fav/${state.me.id}/${name}`;
  const {error} = await sb.storage.from('chat').copy(src, dest);
  if (error && !/exist|duplicate/i.test(error.message)) return toast('Could not save photo');
  await sb.from('favorites').upsert({path: dest, url: publicUrl(dest)});
  await loadFavs(); renderMessages(); renderFavs(); toast('Saved to your photos');
}
async function removeFav(f) {
  await sb.from('favorites').delete().eq('path', f.path);
  await sb.storage.from('chat').remove([f.path]);
  await loadFavs(); renderMessages(); renderFavs();
}

  const p = $('favPanel');

    ${state.favs.length ? `<div class="gr">${state.favs.map((f, i) => `<div class="fi" data-i="${i}"><img src="${esc(f.url)}" alt=""><button class="rm" data-rm="${i}" title="Remove">${ic('x', 'sm')}</button></div>`).join('')}</div>`
      : '<div class="empty" style="padding:16px">Tap the star on any photo in chat to save it here. Tap a saved photo to resend it.</div>'}
    <input type="file" id="favFile" accept="image/*" hidden>`;
  $('favAdd').onclick = () => $('favFile').click();
  $('favFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > MAX_FILE) return toast('Files must be under 10 MB');
    const path = `fav/${state.me.id}/${crypto.randomUUID()}.${extOf(f.name)}`;
    const {error} = await sb.storage.from('chat').upload(path, f, {contentType: f.type});
    if (error) return toast('Upload failed');

$('favBtn').onclick = () => { renderFavs(); togglePanel('favPanel'); };
$('favPanel').onclick = async e => {

  const it = e.target.closest('[data-i]'); if (!it) return;
  const f = state.favs[+it.dataset.i];
  const name = f.path.split('/').pop();
  const type = {png: 'image/png', gif: 'image/gif', webp: 'image/webp', jpg: 'image/jpeg', jpeg: 'image/jpeg'}[extOf(name).toLowerCase()] || 'image/jpeg';
  const {data, error} = await sb.from('messages').insert({channel: state.channel, content: '', attachment_url: f.url, attachment_name: name, attachment_type: type, reply_to: state.replyTo || null}).select().single();
  if (error) return toast('Could not send');
  if (!state.messages.has(data.id)) state.messages.set(data.id, data);
  state.replyTo = null; renderReply();
  closeOverlays('none'); stick = true; renderMessages();
};

/* ---------- 5 minute wipe (timer only, no wording) ---------- */
function tick() {
  const now = Date.now();
  const win = Math.floor(now / WIPE_MS);
  const s = Math.ceil(((win + 1) * WIPE_MS - now) / 1000);
  $('timerTxt').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('soon', s <= 30);
  if (state.lastWindow !== null && state.lastWindow !== win) {
    state.messages = new Map(); state.reactions = new Map();
    state.unread = {}; state.mentionCount = 0; state.replyTo = null;
    renderReply(); renderChannels(); renderMessages(); renderPins(); updateTitle();
    setTimeout(async () => { await loadMessages(); renderMessages(); }, 3000);
  }
  state.lastWindow = win;
}
function updateTitle() { document.title = state.mentionCount ? `(${state.mentionCount}) anon chat` : 'anon chat'; }

/* ---------- settings, invite keys, profile editing ---------- */
function openSettings() {
  showModal(`<h2>${ic('hammer')} Settings</h2>
    <div class="kv"><label class="l">Signed in as</label><div class="val">${esc(state.me.email || '')}</div></div>
    ${state.isOwner ? `<div class="sec"><div class="sh">${ic('gift')} Invite keys</div>
      <div class="hint">Each key works once. Give one to someone so they can create an account. A key shows as used here once it has been claimed.</div>
      <button class="btn" id="genKey">${svg('plus')} Generate key</button>
      <div class="invites" id="inviteList"></div></div>` : ''}
    <div class="row"><button class="btn danger" id="logout">Log out</button></div>`);
  $('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  if (state.isOwner) {
    $('genKey').onclick = async () => {
      $('genKey').disabled = true;
      const {data, error} = await sb.rpc('create_invite_key');
      $('genKey').disabled = false;
      if (error) return toast('Could not create key');
      navigator.clipboard?.writeText(data).catch(() => {});
      toast('Key created and copied');
      await loadInvites();
    };
    $('inviteList').onclick = async e => {
      const c = e.target.closest('[data-copy]'), r = e.target.closest('[data-revoke]');
      if (c) { navigator.clipboard?.writeText(c.dataset.copy); toast('Key copied'); }
      if (r) { await sb.from('invite_keys').delete().eq('id', +r.dataset.revoke); state.invites = state.invites.filter(k => k.id !== +r.dataset.revoke); renderInvites(); }
    };
    loadInvites();
  }
}
async function loadInvites() {
  const {data} = await sb.from('invite_keys').select('*').order('id', {ascending: false});
  state.invites = data || []; renderInvites();
}
function renderInvites() {
  const box = $('inviteList'); if (!box) return;
  if (!state.invites.length) { box.innerHTML = '<div class="hint">No keys yet.</div>'; return; }
  box.innerHTML = state.invites.map(k => {
    if (k.used_at) {
      const who = k.used_by ? prof(k.used_by).username : null;
      return `<div class="inv used"><code>${esc(k.key)}</code><span class="st ok">${ic('check', 'sm')} Used${who ? ' by ' + esc(who) : ''} <small>${esc(new Date(k.used_at).toLocaleString())}</small></span></div>`;
    }
    return `<div class="inv"><code>${esc(k.key)}</code><span class="st">Unused</span><button class="mini" data-copy="${esc(k.key)}">Copy</button><button class="mini" data-revoke="${k.id}">Revoke</button></div>`;
  }).join('');
}

function openEdit(uid) {
  const p = prof(uid);
  let avatar = p.avatar_url;
  showModal(`<h2>${ic('id')} Edit profile</h2>
    <div style="display:flex;align-items:center;gap:14px"><img id="edAv" class="av" style="width:72px;height:72px" src="${esc(avatar)}" alt="">
      <div style="flex:1"><button class="btn sec" id="edRandAv" style="margin-bottom:6px">Randomize picture</button>
      <button class="btn sec" id="edUpAv">Upload picture</button><input type="file" id="edFile" accept="image/*" hidden></div></div>
    <div style="margin-top:14px"><label class="l">Username</label>
    <input class="field" id="edName" maxlength="24" value="${esc(p.username)}" autocomplete="off">
    <div class="hint">Letters, numbers and underscores, 2 to 24 characters.</div></div>
    <div class="row" style="margin-top:0"><button class="btn sec" id="edRandName">Randomize name</button></div>
    <div class="err" id="edErr"></div>
    <div class="row"><button class="btn" id="edSave">Save</button></div>`);
  $('edRandAv').onclick = () => { avatar = avatarFor(crypto.randomUUID().slice(0, 8)); $('edAv').src = avatar; };
  $('edRandName').onclick = () => { $('edName').value = pick(ADJ) + pick(ANI) + (1000 + Math.floor(Math.random() * 9000)); };
  $('edUpAv').onclick = () => $('edFile').click();
  $('edFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > MAX_FILE) return $('edErr').textContent = 'Files must be under 10 MB';
    const path = 'pfp/' + crypto.randomUUID() + '.' + extOf(f.name);
    const {error} = await sb.storage.from('chat').upload(path, f, {contentType: f.type});
    if (error) return $('edErr').textContent = 'Upload failed';
    avatar = publicUrl(path); $('edAv').src = avatar;
  };
  $('edSave').onclick = async () => {
    const name = $('edName').value.trim();
    if (!/^[A-Za-z0-9_]{2,24}$/.test(name)) return $('edErr').textContent = 'Invalid username';
    const {data, error} = await sb.from('profiles').update({username: name, avatar_url: avatar}).eq('id', uid).select();
    if (error) return $('edErr').textContent = /duplicate|unique/i.test(error.message) ? 'That username is taken' : error.message;
    if (!data.length) return $('edErr').textContent = 'Not allowed';
    state.profiles.set(uid, data[0]); rebuildNames();
    renderMe(); renderMembers(); renderMessages(); closeModal();
  };
}

boot();
</script>
